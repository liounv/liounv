<!DOCTYPE html>
<html lang="zh‑CN">
<head>
    <meta charset="UTF‑8">
    <title>系统解剖学专业课助教</title>
    <style>
        body{font-family:system-ui;margin:20px;background:#f4f7fa;}
        .container{max-width:700px;margin:0 auto;background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px #0000001a;}
        h2{text-align:center;color:#222;}
        .chat-box{border:1px solid #ddd;border-radius:8px;padding:16px;height:420px;overflow-y:auto;background:#fafafa;}
        .user{text-align:right;margin:12px 0;}
        .user span{display:inline-block;background:#2563eb;color:white;padding:8px 12px;border-radius:10px;max-width:80%;}
        .bot{text-align:left;margin:12px 0;}
        .bot span{display:inline-block;background:#e5e7eb;color:#111;padding:8px 12px;border-radius:10px;max-width:80%;}
        .tip{margin-top:14px;color:#666;font-size:14px;text-align:center;}
    </style>
</head>
<body>
<div class="container">
    <h2>🩺系统解剖学AI助教（原型演示）</h2>
    <div class="chat-box">
        <div class="user"><span>简述臂丛神经组成</span></div>
        <div class="bot"><span>臂丛神经由第5‑8颈神经前支 + 第1胸神经前支大部分组成，主要支配上肢运动与感觉，是系统解剖上肢部分高频考点。</span></div>

        <div class="user"><span>颅骨一共多少块？</span></div>
        <div class="bot"><span>颅骨一共23块（不含听小骨），分为脑颅骨8块，面颅骨15块，口腔医学需要重点记忆面颅骨。</span></div>

        <div class="user"><span>简述肩关节特点</span></div>
        <div class="bot"><span>肩关节是全身运动最灵活关节，肱骨头大、关节盂浅小；稳固性差，容易向前下方脱位。</span></div>
    </div>
    <div class="tip">
        【原型说明】本演示为静态作品，预录入解剖学示例问答；完整实时对话功能需要对接大模型API。
    </div>
</div>
</body>
</html>
